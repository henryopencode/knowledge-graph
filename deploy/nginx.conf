# Independent public content API and authenticated workspace.
server {
    listen 80;
    listen [::]:80;
    server_name api.henryweb.site knowledge.henryweb.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.henryweb.site;
    ssl_certificate /etc/letsencrypt/live/henryweb.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/henryweb.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name knowledge.henryweb.site;
    ssl_certificate /etc/letsencrypt/live/henryweb.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/henryweb.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep the old /graph/ cookie path on the IP site; map it for this host only.
        proxy_cookie_path /graph/ /;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
