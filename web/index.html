<!doctype html>
<html lang="{{.Locale}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <title>{{t `label_devgraph_knowledge_workspace`}}</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./i18n.js" defer></script>
    <script src="./navigation.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div id="workspace" class="app-shell" data-mode="read">
      <header class="workspace-header">
        <button id="toggle-sidebar" class="icon-button" title="{{t `label_toggle_file_list`}}" aria-label="{{t `label_toggle_file_list`}}" aria-controls="sidebar" aria-expanded="true">
          <span data-icon="panel-left"></span>
        </button>
        <nav class="view-nav" aria-label="{{t `label_view_mode`}}">
          <button id="list-tab" class="view-button active" aria-pressed="true">{{t `notes_view`}}</button>
          <button id="graph-tab" class="view-button" aria-pressed="false">{{t `label_graph`}}</button>
        </nav>
        <div class="search-area">
          <label class="search-box" for="search">
            <span data-icon="search"></span>
            <input id="search" type="search" placeholder="{{t `search_all_notes`}}" autocomplete="off" aria-label="{{t `label_search_workspace`}}" aria-controls="note-list" />
            <kbd id="search-shortcut">⌘ K</kbd>
          </label>
          <button id="clear-search" class="icon-button" aria-label="{{t `clear_search`}}" title="{{t `clear_search`}}" hidden><span data-icon="close"></span></button>
        </div>
        <div class="header-actions">
          <button id="toggle-inspector" class="icon-button" aria-label="{{t `outline_and_links`}}" title="{{t `outline_and_links`}}" aria-controls="inspector" aria-pressed="false"><span data-icon="panel-right"></span></button>
          <details id="workspace-menu" class="workspace-menu">
            <summary class="icon-button" aria-label="{{t `more_options`}}" title="{{t `more_options`}}"><span data-icon="more"></span></summary>
            <div class="menu-content">
              <button id="fullscreen-note" class="menu-item"><span data-icon="expand"></span>{{t `label_read_document_full_screen`}}</button>
              <label class="menu-item workspace-language"><span>{{t `language`}}</span><select id="workspace-language" aria-label="{{t `language`}}">
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
              </select></label>
              <button id="theme-button" class="menu-item"><span data-icon="moon"></span>{{t `label_toggle_color_theme`}}</button>
              <button id="refresh-button" class="menu-item"><span data-icon="refresh"></span>{{t `label_refresh_workspace`}}</button>
              <button id="logout-button" class="menu-item" hidden><span data-icon="logout"></span>{{t `label_sign_out`}}</button>
            </div>
          </details>
        </div>
      </header>
      <aside id="sidebar" class="sidebar" aria-label="{{t `topics`}}">
        <h2 class="sidebar-heading">{{t `topics`}}</h2>
        <nav id="file-tree" class="file-tree" aria-label="{{t `label_document_tree`}}"></nav>
      </aside>
      <div class="main-shell">
        <main class="workspace-content">
          <section id="read-panel" class="read-panel" aria-label="{{t `reading`}}">
            <div id="note-panel" class="note-panel" tabindex="0" aria-label="{{t `label_document_details`}}"></div>
          </section>
          <section id="list-panel" class="list-panel" aria-labelledby="list-heading" hidden>
            <header class="list-heading">
              <h1 id="list-heading">{{t `label_all_documents`}}</h1>
              <span id="list-count" role="status" aria-live="polite" aria-atomic="true"></span>
            </header>
            <div id="note-list"></div>
          </section>
          <section id="graph-panel" class="graph-panel" aria-label="{{t `label_graph`}}" hidden>
            <div id="graph-container" class="graph-container">
              <svg id="graph" role="group" aria-label="{{t `label_document_graph_select_a_node_to_read_or_switch_to_the_document_li`}}" tabindex="0">
                <g id="graph-world"><g id="graph-edges"></g><g id="graph-nodes"></g></g>
              </svg>
              <div id="graph-empty" class="graph-empty" hidden><strong>{{t `label_no_matching_documents`}}</strong></div>
            </div>
            <div class="graph-topline">
              <span id="graph-status"></span>
              <div class="scope-switch" aria-label="{{t `label_connection_depth`}}">
                <button data-depth="1" class="active" aria-pressed="true">{{t `related_scope`}}</button>
                <button data-depth="0" aria-pressed="false">{{t `label_global`}}</button>
              </div>
            </div>
            <div class="graph-bottomline">
              <div class="zoom-controls">
                <button id="zoom-out" class="icon-button" aria-label="{{t `label_zoom_out`}}"><span data-icon="minus"></span></button>
                <span id="zoom-label">100%</span>
                <button id="zoom-in" class="icon-button" aria-label="{{t `label_zoom_in`}}"><span data-icon="plus"></span></button>
                <button id="fit-graph" class="icon-button" aria-label="{{t `label_reset_graph_position`}}" title="{{t `label_fit_to_canvas`}}"><span data-icon="fit"></span></button>
              </div>
            </div>
          </section>
          <aside id="inspector" class="inspector" aria-label="{{t `outline_and_links`}}">
            <div class="inspector-toolbar"><span>{{t `outline_and_links`}}</span><button id="close-inspector" class="icon-button" aria-label="{{t `label_close_document_panel`}}"><span data-icon="close"></span></button></div>
            <div id="relation-panel" class="relation-panel"></div>
          </aside>
        </main>
      </div>
    </div>
    <dialog id="reader-dialog" class="reader-dialog" aria-labelledby="reader-heading">
      <header class="reader-toolbar">
        <button id="close-reader" class="reader-back"><span data-icon="back"></span><span>{{t `back_to_reading`}}</span></button>
      </header>
      <div id="reader-scroll" class="reader-scroll"><div id="reader-content" class="reader-content"><h1 id="reader-heading">{{t `label_document`}}</h1></div></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
